[project]
name = "deskrag"
version = "0.1.0"
description = "University help-desk RAG system plus an evaluation harness for retrieval, abstention, and regressions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "ollama>=0.6.3",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "typer>=0.27.3",
]

[project.scripts]
deskrag = "deskrag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deskrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"] # `ruff format` handles line length; long strings and comments are fine

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
scrape = [
    "httpx>=0.28.1",
    "trafilatura>=2.3.1",
]
