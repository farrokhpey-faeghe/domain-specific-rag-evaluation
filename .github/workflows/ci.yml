name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch to save Actions minutes (private repo).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Tests (also validates committed test cases, corpus, and configs)
        run: uv run pytest
